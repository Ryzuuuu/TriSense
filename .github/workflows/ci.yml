name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The fast unit tests need no hardware, models, torch or MediaPipe.
      - name: Install test tooling
        run: python -m pip install numpy pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest
