<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111823"/>
    </linearGradient>
    <filter id="card_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@600;700&amp;display=swap');
      
      .box-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13.5px; fill: #ffffff; }
      .box-desc { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11px; fill: #8b949e; }
      .tag { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; fill: #38bdf8; }
      
      /* Flow Particle Animations */
      @keyframes flowLeftToCenter {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(115px); opacity: 0; }
      }
      .dot1 { animation: flowLeftToCenter 2.2s linear infinite; }
      .dot2 { animation: flowLeftToCenter 2.2s linear infinite 0.7s; }
      .dot3 { animation: flowLeftToCenter 2.2s linear infinite 1.4s; }

      @keyframes flowCenterToRight {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(115px); opacity: 0; }
      }
      .dot4 { animation: flowCenterToRight 2.2s linear infinite 0.4s; }
      .dot5 { animation: flowCenterToRight 2.2s linear infinite 1.1s; }
      .dot6 { animation: flowCenterToRight 2.2s linear infinite 1.8s; }

      /* Subtle Hub Glow */
      @keyframes hubGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .hub-border { animation: hubGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg_arch)" rx="12"/>
  <rect width="100%" height="100%" rx="12" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- Column Headers -->
  <text x="135" y="42" text-anchor="middle" class="box-title" fill="#6e7681">SENSORY INPUT BUS</text>
  <text x="425" y="42" text-anchor="middle" class="box-title" fill="#58a6ff">EDGE EMBEDDED ENGINE (RPI 4)</text>
  <text x="715" y="42" text-anchor="middle" class="box-title" fill="#6e7681">ACTUATOR / DISPLAY BUS</text>

  <!-- ── Left Column: Sensors ────────────────────────────────────────────────── -->
  <!-- Ultrasonic HC-SR04 -->
  <g transform="translate(35, 65)">
    <rect width="200" height="65" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2" filter="url(#card_shadow)"/>
    <circle cx="25" cy="32" r="8" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="25" cy="32" r="3" fill="#10b981"/>
    <text x="48" y="28" class="box-title">Ultrasonic HC-SR04</text>
    <text x="48" y="45" class="box-desc">20Hz Spatial Ping Array</text>
  </g>

  <!-- I2S Mic INMP441 -->
  <g transform="translate(35, 145)">
    <rect width="200" height="65" rx="8" fill="#161b22" stroke="#00f0ff" stroke-width="1.2" filter="url(#card_shadow)"/>
    <circle cx="25" cy="32" r="8" fill="#00f0ff" fill-opacity="0.2"/>
    <circle cx="25" cy="32" r="3" fill="#00f0ff"/>
    <text x="48" y="28" class="box-title">I2S Mic INMP441</text>
    <text x="48" y="45" class="box-desc">16kHz 16-bit Mono PCM</text>
  </g>

  <!-- Video Camera Stream -->
  <g transform="translate(35, 225)">
    <rect width="200" height="65" rx="8" fill="#161b22" stroke="#a855f7" stroke-width="1.2" filter="url(#card_shadow)"/>
    <circle cx="25" cy="32" r="8" fill="#a855f7" fill-opacity="0.2"/>
    <circle cx="25" cy="32" r="3" fill="#a855f7"/>
    <text x="48" y="28" class="box-title">Video Stream</text>
    <text x="48" y="45" class="box-desc">MediaPipe 3D Hand Tracking</text>
  </g>

  <!-- ── Center Column: Processing Engines ────────────────────────────────────── -->
  <!-- Spatial Collision & Haptics Engine -->
  <g transform="translate(300, 65)">
    <rect width="250" height="65" rx="8" fill="#0d1117" stroke="#10b981" stroke-width="2" class="hub-border"/>
    <text x="20" y="28" class="box-title">Collision Math &amp; Alert Engine</text>
    <text x="20" y="45" class="box-desc">Zone Matrix • Haptic/Audio PWM</text>
  </g>

  <!-- Offline Vosk ASR Engine -->
  <g transform="translate(300, 145)">
    <rect width="250" height="65" rx="8" fill="#0d1117" stroke="#00f0ff" stroke-width="2" class="hub-border"/>
    <text x="20" y="28" class="box-title">Vosk Offline ASR Engine</text>
    <text x="20" y="45" class="box-desc">KaldiRecognizer • 20-Char Wrap</text>
  </g>

  <!-- 3D Sign Classifier Engine -->
  <g transform="translate(300, 225)">
    <rect width="250" height="65" rx="8" fill="#0d1117" stroke="#a855f7" stroke-width="2" class="hub-border"/>
    <text x="20" y="28" class="box-title">1D-CNN + GRU Sign Classifier</text>
    <text x="20" y="45" class="box-desc">EMA α=0.6 • 30-Frame FIFO Deque</text>
  </g>

  <!-- ── Right Column: Actuators / Output ──────────────────────────────────────── -->
  <!-- PWM Haptic Motors / Buzzer -->
  <g transform="translate(615, 65)">
    <rect width="200" height="65" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2" filter="url(#card_shadow)"/>
    <text x="22" y="28" class="box-title">PWM Haptics &amp; Audio</text>
    <text x="22" y="45" class="box-desc">Dynamic Pulse Actuation</text>
  </g>

  <!-- SSD1306 OLED Subtitle Viewport -->
  <g transform="translate(615, 145)">
    <rect width="200" height="65" rx="8" fill="#161b22" stroke="#00f0ff" stroke-width="1.2" filter="url(#card_shadow)"/>
    <text x="22" y="28" class="box-title">SSD1306 OLED Subtitles</text>
    <text x="22" y="45" class="box-desc">3-Line Rolling I2C Subtitles</text>
  </g>

  <!-- Sign Vocabulary Output / TTS -->
  <g transform="translate(615, 225)">
    <rect width="200" height="65" rx="8" fill="#161b22" stroke="#a855f7" stroke-width="1.2" filter="url(#card_shadow)"/>
    <text x="22" y="28" class="box-title">12-Word Sign Output</text>
    <text x="22" y="45" class="box-desc">Edge Softmax Prediction</text>
  </g>

  <!-- ── Connecting Arrows (Left -> Center) ──────────────────────────────────── -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <line x1="235" y1="97" x2="300" y2="97"/>
    <line x1="235" y1="177" x2="300" y2="177"/>
    <line x1="235" y1="257" x2="300" y2="257"/>
  </g>

  <!-- Animated Particles (Left -> Center) -->
  <g fill="#10b981">
    <circle cx="235" cy="97" r="3" class="dot1"/>
  </g>
  <g fill="#00f0ff">
    <circle cx="235" cy="177" r="3" class="dot2"/>
  </g>
  <g fill="#a855f7">
    <circle cx="235" cy="257" r="3" class="dot3"/>
  </g>

  <!-- ── Connecting Arrows (Center -> Right) ─────────────────────────────────── -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <line x1="550" y1="97" x2="615" y2="97"/>
    <line x1="550" y1="177" x2="615" y2="177"/>
    <line x1="550" y1="257" x2="615" y2="257"/>
  </g>

  <!-- Animated Particles (Center -> Right) -->
  <g fill="#10b981">
    <circle cx="550" cy="97" r="3" class="dot4"/>
  </g>
  <g fill="#00f0ff">
    <circle cx="550" cy="177" r="3" class="dot5"/>
  </g>
  <g fill="#a855f7">
    <circle cx="550" cy="257" r="3" class="dot6"/>
  </g>
</svg>
