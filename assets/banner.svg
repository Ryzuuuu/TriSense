<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#0f1622"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;700;800&amp;display=swap');
      
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 13.5px; fill: #8b949e; }
      .mono-label { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11.5px; fill: #e6edf3; }
      
      /* Radar Pulse Animation */
      @keyframes pulse {
        0% { r: 15px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 50px; opacity: 0; stroke-width: 0.5px; }
      }
      .wave1 { animation: pulse 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
      .wave2 { animation: pulse 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1s; }
      .wave3 { animation: pulse 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 2s; }
      
      /* Audio Bar Animation */
      @keyframes eq {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1.0); }
      }
      .bar1 { animation: eq 1.2s ease-in-out infinite 0.1s; transform-origin: bottom; }
      .bar2 { animation: eq 1.4s ease-in-out infinite 0.4s; transform-origin: bottom; }
      .bar3 { animation: eq 1.1s ease-in-out infinite 0.2s; transform-origin: bottom; }
      .bar4 { animation: eq 1.5s ease-in-out infinite 0.6s; transform-origin: bottom; }
      .bar5 { animation: eq 1.3s ease-in-out infinite 0.3s; transform-origin: bottom; }

      /* Scanning Line Animation */
      @keyframes scan {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateX(850px); opacity: 0; }
      }
      .scanner { animation: scan 6s linear infinite; }

      /* Node Glow Pulse */
      @keyframes statusGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.5)); }
        50% { opacity: 1.0; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.9)); }
      }
      .status-pill { animation: statusGlow 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>
  <rect width="100%" height="100%" rx="12" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- Scanning Cyber Line -->
  <line x1="0" y1="120" x2="850" y2="120" stroke="#00f0ff" stroke-width="0.8" opacity="0.15" class="scanner"/>

  <!-- Left Hero Symbol (TriSense Core Radar / Waveform) -->
  <g transform="translate(100, 115)">
    <!-- Expanding Waves -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00f0ff" class="wave1"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#7000ff" class="wave2"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#10b981" class="wave3"/>
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="18" fill="#0e1420" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#00f0ff"/>
    
    <!-- Orbiting Sensory Dots -->
    <circle cx="-32" cy="-28" r="4.5" fill="#10b981"/>
    <line x1="0" y1="0" x2="-32" y2="-28" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
    
    <circle cx="36" cy="-22" r="4.5" fill="#00f0ff"/>
    <line x1="0" y1="0" x2="36" y2="-22" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>

    <circle cx="0" cy="38" r="4.5" fill="#a855f7"/>
    <line x1="0" y1="0" x2="0" y2="38" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(205, 78)">
    <text x="0" y="0" class="title">TriSense</text>
    <circle cx="198" cy="-12" r="4" fill="#00f0ff" filter="url(#glow)"/>
    
    <text x="0" y="28" class="subtitle">Embedded Multi-Modal Sensory Augmentation Platform</text>
    <text x="0" y="48" class="subtitle" fill="#58a6ff" font-size="12px">Raspberry Pi 4 • I2S/I2C/GPIO Edge Audio &amp; Vision • Offline AI</text>
  </g>

  <!-- Animated Equalizer Waves / Decoration Right -->
  <g transform="translate(740, 115)">
    <rect x="-30" y="-18" width="4" height="36" rx="2" fill="#00f0ff" class="bar1"/>
    <rect x="-20" y="-24" width="4" height="48" rx="2" fill="#7000ff" class="bar2"/>
    <rect x="-10" y="-14" width="4" height="28" rx="2" fill="#10b981" class="bar3"/>
    <rect x="0" y="-28" width="4" height="56" rx="2" fill="#00f0ff" class="bar4"/>
    <rect x="10" y="-20" width="4" height="40" rx="2" fill="#a855f7" class="bar5"/>
  </g>

  <!-- Sensory Mode Pills (Bottom Bar) -->
  <g transform="translate(205, 175)">
    <!-- Blind Mode -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="30" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#10b981" class="status-pill"/>
      <text x="28" y="19" class="mono-label" fill="#34d399">BLIND MODE</text>
    </g>

    <!-- Deaf Mode -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#00f0ff" class="status-pill"/>
      <text x="28" y="19" class="mono-label" fill="#38bdf8">DEAF MODE</text>
    </g>

    <!-- Mute Mode -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="135" height="30" rx="6" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#a855f7" class="status-pill"/>
      <text x="28" y="19" class="mono-label" fill="#c084fc">MUTE MODE</text>
    </g>
  </g>
</svg>
