<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_matrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#111823"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@600;700;800&amp;display=swap');
      
      .mode-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; }
      .mode-sub { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; fill: #8b949e; }
      .spec-line { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11.5px; fill: #c9d1d9; }
      
      /* Active Pulse Animation */
      @keyframes dotPulse {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 8px; opacity: 0.5; }
      }
      .pulse-emerald { animation: dotPulse 2s infinite; fill: #10b981; }
      .pulse-cyan { animation: dotPulse 2s infinite 0.6s; fill: #00f0ff; }
      .pulse-violet { animation: dotPulse 2s infinite 1.2s; fill: #a855f7; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg_matrix)" rx="12"/>
  <rect width="100%" height="100%" rx="12" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- Card 1: Blind Mode -->
  <g transform="translate(25, 25)">
    <rect width="250" height="150" rx="10" fill="#0e141e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="25" cy="28" r="5" class="pulse-emerald"/>
    <text x="42" y="32" class="mode-title" fill="#34d399">BLIND MODE</text>
    <text x="25" y="55" class="mode-sub">SPATIAL COLLISION &amp; HAPTICS</text>
    <line x1="25" y1="68" x2="225" y2="68" stroke="#21262d" stroke-width="1"/>
    <text x="25" y="90" class="spec-line">• HC-SR04 20Hz Polling</text>
    <text x="25" y="110" class="spec-line">• Multi-Zone Range Matrix</text>
    <text x="25" y="130" class="spec-line">• PWM Haptic &amp; Audio Driver</text>
  </g>

  <!-- Card 2: Deaf Mode -->
  <g transform="translate(300, 25)">
    <rect width="250" height="150" rx="10" fill="#0e141e" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="25" cy="28" r="5" class="pulse-cyan"/>
    <text x="42" y="32" class="mode-title" fill="#38bdf8">DEAF MODE</text>
    <text x="25" y="55" class="mode-sub">OFFLINE SPEECH SUBTITLES</text>
    <line x1="25" y1="68" x2="225" y2="68" stroke="#21262d" stroke-width="1"/>
    <text x="25" y="90" class="spec-line">• INMP441 I2S 16kHz PCM</text>
    <text x="25" y="110" class="spec-line">• Vosk KaldiRecognizer AI</text>
    <text x="25" y="130" class="spec-line">• SSD1306 OLED Viewport</text>
  </g>

  <!-- Card 3: Mute Mode -->
  <g transform="translate(575, 25)">
    <rect width="250" height="150" rx="10" fill="#0e141e" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="25" cy="28" r="5" class="pulse-violet"/>
    <text x="42" y="32" class="mode-title" fill="#c084fc">MUTE MODE</text>
    <text x="25" y="55" class="mode-sub">3D SIGN LANGUAGE RECOGNITION</text>
    <line x1="25" y1="68" x2="225" y2="68" stroke="#21262d" stroke-width="1"/>
    <text x="25" y="90" class="spec-line">• MediaPipe Hands (3D XYZ)</text>
    <text x="25" y="110" class="spec-line">• EMA α=0.6 Jitter Filtering</text>
    <text x="25" y="130" class="spec-line">• 1D-CNN+GRU Classifier</text>
  </g>
</svg>
